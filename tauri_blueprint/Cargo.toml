[package]
name = "one-barcode-admin"
version = "1.0.0"
description = "One Barcode Retail Admin Sync Panel"
authors = ["Retail Smart Systems"]
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
notify = "6.1.1"
rusqlite = { version = "0.29.0", features = ["bundled"] }
calamine = "0.22.1" # For reading Excel sheets in Rust
